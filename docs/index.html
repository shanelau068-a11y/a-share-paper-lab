<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a27"><title>慢投 · A股模拟实验室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' rx='15' fill='%23132a27'/%3E%3Cpath d='M12 42L25 30L34 34L48 17' stroke='%23c9ec97' stroke-width='5' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body><div class="shell"><aside><a class="brand" href="./">慢投<span>LAB</span></a><p class="aside-caption">让判断，先经得起模拟</p><nav><button data-tab="overview" class="active">◫ <span>投资总览</span></button><button data-tab="candidates">⌕ <span>每日观察</span></button><button data-tab="portfolio">▤ <span>我的持仓</span></button><button data-tab="orders">⇄ <span>委托与记录</span></button><button data-tab="learn">◎ <span>规则与研究</span></button></nav><div class="aside-foot"><b>100% 虚拟资金</b><p>练习、记录、再判断。<br>不接券商，不产生真实交易。</p><span class="version">A股模拟实验室 · v0.1</span></div></aside><main><header><div><span class="eyebrow">PAPER TRADING / A-SHARES</span><h1 id="page-title">先看清，再行动。</h1><p id="subtitle">用真实行情，检验你的投资想法。</p></div><button id="refresh" class="primary">↻ 刷新行情</button></header><div id="status" class="status">正在连接行情服务，尚未生成候选…</div><div id="notice" class="notice">这是模拟学习工具。观察条件与价格线由固定规则计算，不是盈利预测；空仓也是一种选择。</div><section id="content" aria-live="polite"></section><footer><span>账户存在当前浏览器 · 换设备前请导出备份</span><div><button id="export" class="text-btn">导出账户</button><label class="text-btn" for="import">导入备份</label><input type="file" id="import" accept="application/json" hidden></div></footer></main></div><dialog id="trade-dialog"><form id="trade-form"><div class="dialog-head"><div><span class="eyebrow">VIRTUAL LIMIT ORDER</span><h2 id="trade-title">提交模拟委托</h2></div><button type="button" id="close-dialog" class="icon-btn" aria-label="关闭">×</button></div><p id="trade-quote" class="muted"></p><input type="hidden" id="symbol"><label>方向<select id="side"><option value="buy">模拟买入</option><option value="sell">模拟卖出</option></select></label><label>限价（元）<input id="limit" type="number" min="0.01" step="0.01" required></label><label>数量（100股/份的整数倍）<input id="qty" type="number" min="100" step="100" value="100" required></label><p id="estimate" class="estimate"></p><p class="small muted">按刷新时买一/卖一价，加0.05%不利滑点和费用撮合。休市只登记委托；不追溯成交、不保证成交。单标的最高20%虚拟资产。</p><p id="form-error" class="error"></p><button type="submit" class="primary wide">提交虚拟限价单</button></form></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
